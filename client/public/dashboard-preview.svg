<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Budgetry dashboard preview</title>
<desc id="desc">An illustrative screenshot of the Budgetry expense dashboard with monthly summary cards, a monthly spending bar chart, category breakdown, recent expenses, and an emerald accent theme.</desc>
<defs>
 <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111C31"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
 <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="720" rx="24" fill="url(#page)"/>
<rect x="1" y="1" width="1198" height="718" rx="23" fill="none" stroke="#475569"/>
<!-- App header -->
<rect x="1" y="1" width="1198" height="74" rx="23" fill="#111C2D"/>
<path d="M1 53V75H1199V53" fill="#111C2D"/>
<rect x="30" y="20" width="36" height="36" rx="11" fill="url(#emerald)"/>
<path d="M39 26h11c10 0 13 9 5 14 9 3 5 12-4 12H39z" fill="#0F172A"/>
<path d="M45 33h5c4 0 4 4 1 6l-6 3zm0 11c5-3 9-3 10 0 1 2-1 4-4 4h-6z" fill="#34D399"/>
<text x="78" y="43" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" fill="#F8FAFC">Budget<tspan fill="#34D399">ry</tspan></text>
<text x="350" y="42" font-family="Inter,Arial,sans-serif" font-size="15" fill="#CBD5E1">Dashboard</text>
<text x="463" y="42" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94A3B8">Expenses</text>
<text x="566" y="42" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94A3B8">Reports</text>
<text x="652" y="42" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94A3B8">Budgets</text>
<rect x="1016" y="17" width="151" height="40" rx="10" fill="#10B981"/>
<text x="1091" y="42" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#052E24">+ Add expense</text>
<!-- Greeting and month picker -->
<text x="32" y="113" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#6EE7B7">YOUR FINANCIAL SNAPSHOT</text>
<text x="32" y="150" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#F8FAFC">Good morning, Alex ✳</text>
<text x="32" y="177" font-family="Inter,Arial,sans-serif" font-size="14" fill="#CBD5E1">Know where your money goes.</text>
<rect x="1010" y="119" width="157" height="42" rx="9" fill="#1E293B" stroke="#475569"/>
<text x="1088" y="145" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#F8FAFC">October 2026  ▾</text>
<!-- Four stats -->
<g filter="url(#shadow)">
 <rect x="32" y="200" width="275" height="127" rx="13" fill="#1E293B" stroke="#10B981" stroke-opacity=".6"/>
 <rect x="323" y="200" width="275" height="127" rx="13" fill="#1E293B" stroke="#475569"/>
 <rect x="614" y="200" width="275" height="127" rx="13" fill="#1E293B" stroke="#475569"/>
 <rect x="905" y="200" width="263" height="127" rx="13" fill="#1E293B" stroke="#475569"/>
</g>
<g font-family="Inter,Arial,sans-serif">
 <text x="52" y="231" font-size="13" fill="#CBD5E1">Total spent this month</text><text x="52" y="274" font-size="32" font-weight="800" fill="#F8FAFC">₹24,560</text><text x="52" y="302" font-size="13" fill="#6EE7B7">October 2026</text>
 <text x="343" y="231" font-size="13" fill="#CBD5E1">Change vs last month</text><text x="343" y="274" font-size="30" font-weight="800" fill="#6EE7B7">↘ 8.4%</text><text x="343" y="302" font-size="13" fill="#CBD5E1">Lower than September</text>
 <text x="634" y="231" font-size="13" fill="#CBD5E1">Top spending category</text><text x="634" y="274" font-size="29" font-weight="800" fill="#F8FAFC">Rent</text><text x="634" y="302" font-size="13" fill="#CBD5E1">₹11,500 this month</text>
 <text x="925" y="231" font-size="13" fill="#CBD5E1">Daily average spend</text><text x="925" y="274" font-size="29" font-weight="800" fill="#F8FAFC">₹792</text><text x="925" y="302" font-size="13" fill="#CBD5E1">Per calendar day</text>
</g>
<!-- Chart cards -->
<rect x="32" y="348" width="680" height="232" rx="13" fill="#1E293B" stroke="#475569"/>
<rect x="728" y="348" width="440" height="232" rx="13" fill="#1E293B" stroke="#475569"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="54" y="378" font-size="11" font-weight="800" letter-spacing="1.8" fill="#6EE7B7">CASH FLOW</text>
 <text x="54" y="405" font-size="19" font-weight="750" fill="#F8FAFC">Monthly spending</text>
 <text x="54" y="427" font-size="12" fill="#CBD5E1">Your spending, month by month</text>
 <text x="1048" y="378" font-size="11" font-weight="800" letter-spacing="1.8" fill="#6EE7B7">WHERE IT GOES</text>
 <text x="750" y="405" font-size="19" font-weight="750" fill="#F8FAFC">By category</text>
 <text x="750" y="427" font-size="12" fill="#CBD5E1">October 2026</text>
</g>
<!-- Bar chart grid -->
<g stroke="#475569" stroke-dasharray="4 5" stroke-width="1">
 <path d="M64 463H682M64 495H682M64 527H682"/>
</g>
<g fill="url(#emerald)">
 <rect x="91" y="492" width="30" height="35" rx="5"/><rect x="145" y="474" width="30" height="53" rx="5"/><rect x="199" y="499" width="30" height="28" rx="5"/><rect x="253" y="454" width="30" height="73" rx="5"/><rect x="307" y="482" width="30" height="45" rx="5"/><rect x="361" y="441" width="30" height="86" rx="5"/><rect x="415" y="470" width="30" height="57" rx="5"/><rect x="469" y="459" width="30" height="68" rx="5"/><rect x="523" y="489" width="30" height="38" rx="5"/><rect x="577" y="450" width="30" height="77" rx="5"/><rect x="631" y="477" width="30" height="50" rx="5"/>
</g>
<g font-family="Inter,Arial,sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">
 <text x="106" y="550">Nov</text><text x="160" y="550">Dec</text><text x="214" y="550">Jan</text><text x="268" y="550">Feb</text><text x="322" y="550">Mar</text><text x="376" y="550">Apr</text><text x="430" y="550">May</text><text x="484" y="550">Jun</text><text x="538" y="550">Jul</text><text x="592" y="550">Aug</text><text x="646" y="550">Sep</text>
</g>
<!-- Donut chart -->
<circle cx="838" cy="487" r="62" fill="none" stroke="#475569" stroke-width="24"/>
<circle cx="838" cy="487" r="62" fill="none" stroke="#10B981" stroke-width="24" stroke-dasharray="162 390" transform="rotate(-90 838 487)"/>
<circle cx="838" cy="487" r="62" fill="none" stroke="#3B82F6" stroke-width="24" stroke-dasharray="96 390" stroke-dashoffset="-168" transform="rotate(-90 838 487)"/>
<circle cx="838" cy="487" r="62" fill="none" stroke="#F59E0B" stroke-width="24" stroke-dasharray="58 390" stroke-dashoffset="-270" transform="rotate(-90 838 487)"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="838" y="483" font-size="18" font-weight="800" fill="#F8FAFC">₹24.5k</text><text x="838" y="503" font-size="11" fill="#CBD5E1">spent</text></g>
<g font-family="Inter,Arial,sans-serif" font-size="12">
 <circle cx="928" cy="459" r="5" fill="#10B981"/><text x="941" y="463" fill="#F8FAFC">Rent</text><text x="1147" y="463" text-anchor="end" fill="#CBD5E1">₹11,500</text>
 <circle cx="928" cy="488" r="5" fill="#3B82F6"/><text x="941" y="492" fill="#F8FAFC">Food</text><text x="1147" y="492" text-anchor="end" fill="#CBD5E1">₹6,420</text>
 <circle cx="928" cy="517" r="5" fill="#F59E0B"/><text x="941" y="521" fill="#F8FAFC">Transport</text><text x="1147" y="521" text-anchor="end" fill="#CBD5E1">₹2,180</text>
 <circle cx="928" cy="546" r="5" fill="#475569"/><text x="941" y="550" fill="#F8FAFC">Other</text><text x="1147" y="550" text-anchor="end" fill="#CBD5E1">₹4,460</text>
</g>
<!-- Recent expenses -->
<rect x="32" y="598" width="1136" height="90" rx="13" fill="#1E293B" stroke="#475569"/>
<text x="54" y="625" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750" fill="#F8FAFC">Recent expenses</text>
<text x="54" y="649" font-family="Inter,Arial,sans-serif" font-size="12" fill="#CBD5E1">Groceries for the week</text><text x="360" y="649" font-family="Inter,Arial,sans-serif" font-size="12" fill="#CBD5E1">Food</text><text x="612" y="649" font-family="Inter,Arial,sans-serif" font-size="12" fill="#CBD5E1">17 Oct 2026</text><text x="1140" y="649" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="end" fill="#F8FAFC">₹1,250</text>
</svg>