<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Track your expenses privately, understand monthly spending, and export your records." />
    <meta property="og:title" content="PocketLedger — Expense Tracker" />
    <meta property="og:description" content="A simple, privacy-conscious expense tracker." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PocketLedger — Expense Tracker</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('expense-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved :
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
